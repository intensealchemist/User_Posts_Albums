<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Posts &amp; Albums Explorer</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <header>
        <h1>User Posts &amp; Albums Explorer</h1>
    </header>

    <main class="app-layout">

        <!-- Users Panel -->
        <section class="panel--users">
            <h2 class="panel__heading">Users</h2>
            <ul id="users-list" class="users-list"></ul>
        </section>

        <!-- Detail Panel -->
        <section class="panel--detail">

            <div id="empty-state" class="empty-state">
                Select a user to see their posts &amp; albums.
            </div>

            <div id="detail-content" hidden>
                <h2 id="detail-name"></h2>
                <p id="detail-email"></p>
                <p id="detail-company"></p>

                <h3 id="posts-heading" style="margin-top:1rem">Posts</h3>
                <ul id="posts-list" class="detail-list"></ul>

                <h3 id="albums-heading" style="margin-top:1rem">Albums</h3>
                <ul id="albums-list" class="detail-list"></ul>
            </div>

        </section>

    </main>

    <footer>
        <p>Data from <a href="https://jsonplaceholder.typicode.com" target="_blank" rel="noopener">JSONPlaceholder</a></p>
    </footer>

    <script src="https://code.jquery.com/jquery-4.0.0-beta.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
