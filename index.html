<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Posts &amp; Albums Explorer</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <header>
        <h1>User Posts &amp; Albums Explorer</h1>
    </header>

    <main class="app-layout">

        <!-- Users Panel (LLD v0.3 §7) -->
        <section id="users-panel" class="panel--users">
            <h2 class="panel_heading">Users</h2>
            <div id="users-loading" hidden></div>
            <div id="users-error" hidden></div>
            <div id="users-list" class="users-list"></div>
        </section>

        <!-- Detail Panel (LLD v0.3 §7) -->
        <section id="details-panel" class="panel--detail">

            <h2 id="selected-user" class="detail-user-name"></h2>

            <!-- Posts section — independent loading/error state -->
            <div id="posts-section" class="detail-section">
                <h3 class="panel_heading">Posts</h3>
                <div id="posts-loading" hidden></div>
                <div id="posts-error" hidden></div>
                <div id="posts-content"></div>
            </div>

            <!-- Albums section — independent loading/error state -->
            <div id="albums-section" class="detail-section">
                <h3 class="panel_heading">Albums</h3>
                <div id="albums-loading" hidden></div>
                <div id="albums-error" hidden></div>
                <div id="albums-content"></div>
            </div>

        </section>

    </main>

    <footer>
        <p>Data from <a href="https://jsonplaceholder.typicode.com" target="_blank" rel="noopener">JSONPlaceholder</a>
        </p>
    </footer>

    <script src="https://code.jquery.com/jquery-4.0.0-beta.min.js"></script>
    <script>
        if (typeof jQuery === 'undefined') {
            document.getElementById('users-panel').innerHTML =
                '<div class="state-msg error" style="margin-top: 1rem;">Critical Error: Failed to load required libraries (jQuery). Please check your internet connection and refresh the page.</div>';
            throw new Error('jQuery failed to load from CDN.');
        }
    </script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
